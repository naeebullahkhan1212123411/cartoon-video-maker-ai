<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Cartoon Studio</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101225;
      color: white;
    }
    header {
      padding: 22px 8%;
      border-bottom: 1px solid #30334d;
      font-size: 22px;
      font-weight: bold;
    }
    main {
      max-width: 760px;
      margin: 55px auto;
      padding: 24px;
    }
    h1 { font-size: 42px; }
    .gradient { color: #b8a5ff; }
    p { color: #c3c6dc; line-height: 1.7; }
    .panel {
      background: #1b1e38;
      padding: 24px;
      border-radius: 18px;
      border: 1px solid #343755;
    }
    label {
      display: block;
      margin: 18px 0 9px;
    }
    textarea, select {
      width: 100%;
      padding: 14px;
      background: #101225;
      color: white;
      border: 1px solid #454967;
      border-radius: 10px;
      font-size: 16px;
    }
    textarea { min-height: 125px; resize: vertical; }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #8265f6;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }
    #result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #282445;
      display: none;
      line-height: 1.7;
    }
    footer {
      text-align: center;
      padding: 25px;
      color: #a7aac3;
    }
  </style>
</head>
<body>
  <header>🎬 AI Cartoon Studio</header>
  <main>
    <h1>Turn Your Story Into <span class="gradient">Cartoon Magic</span></h1>
    <p>Write your story, choose a cartoon style, and start creating your next animated adventure.</p>

    <section class="panel">
      <h2>Create Your Cartoon</h2>

      <label for="story">Your story</label>
      <textarea id="story" placeholder="A little cat discovers a magical forest..."></textarea>

      <label for="style">Cartoon style</label>
      <select id="style">
        <option>3D Cartoon</option>
        <option>Anime</option>
        <option>Classic 2D Cartoon</option>
        <option>Watercolor Animation</option>
      </select>

      <label for="duration">Video duration</label>
      <select id="duration">
        <option value="15">15 seconds</option>
        <option value="30">30 seconds</option>
        <option value="60">1 minute</option>
      </select>

      <button onclick="createCartoon()">✨ Create My Cartoon</button>
      <div id="result" role="status"></div>
    </section>
  </main>
  <footer>AI Cartoon Studio · Bring your imagination to life</footer>

  <script>
    function createCartoon() {
      const story = document.getElementById('story').value.trim();
      const style = document.getElementById('style').value;
      const duration = document.getElementById('duration').value;
      const result = document.getElementById('result');

      result.style.display = 'block';

      if (!story) {
        result.textContent = 'Please write your story first!';
        return;
      }

      result.textContent =
        'Your cartoon project is ready to set up! ' +
        'Style: ' + style + '. Duration: ' + duration +
        ' seconds. AI video generation must be connected to create an actual video.';
    }
  </script>
</body>
</html>
